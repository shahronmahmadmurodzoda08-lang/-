name: Build BOOKS Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, chatgpt-access-check-20261105 ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name books_learning_app .
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = list(Path("android/app").glob("build.gradle")) + list(Path("android/app").glob("build.gradle.kts"))
          if not candidates:
              raise SystemExit("Android app Gradle file not found")
          changed = False
          for p in candidates:
              s = p.read_text()
              s2 = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", s)
              s2 = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", s2)
              s2 = re.sub(r"compileSdk\s*=\s*34", "compileSdk = 36", s2)
              s2 = re.sub(r"compileSdkVersion\s+34", "compileSdkVersion 36", s2)
              if s2 != s:
                  p.write_text(s2)
                  changed = True
          combined = "\n".join(p.read_text() for p in candidates)
          if not re.search(r"compileSdk\s*=\s*36|compileSdkVersion\s+36", combined):
              raise SystemExit("Could not set compileSdk to 36; inspect generated Gradle syntax")
          print("Android compileSdk configured to 36")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: books-learning-apk
          path: build/app/outputs/flutter-apk/app-release.apk
