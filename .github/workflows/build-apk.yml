name: Build BOOKS Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, chatgpt-access-check-20261105 ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name books_learning_app .
      - name: Set Android compile SDK to 36
        run: |
          echo "Generated Android Gradle file:"
          ls -la android/app
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            grep -n 'compileSdk' android/app/build.gradle.kts
            grep -q 'compileSdk = 36' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            grep -n 'compileSdk' android/app/build.gradle
            grep -q 'compileSdkVersion 36' android/app/build.gradle
          else
            echo "Android app Gradle file was not generated"
            exit 1
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: books-learning-apk
          path: build/app/outputs/flutter-apk/app-release.apk
