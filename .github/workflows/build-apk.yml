name: Build BOOKS Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master, chatgpt-access-check-20261105 ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name books_learning_app .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: books-learning-apk
          path: build/app/outputs/flutter-apk/app-release.apk
